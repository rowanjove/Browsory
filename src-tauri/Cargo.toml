[package]
name = "browsory"
version = "0.1.1"
description = "Browsory - 浏览足迹 (Local Browser History Archive Tool)"
authors = ["Browsory contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled", "bundled-full"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
sysinfo = "0.33"
directories = "6.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
url = "2.5"
regex = "1.11"
csv = "1.3"
rust_xlsxwriter = "0.82"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
hex = "0.4"
keyring = "3"
notify = "6.1"
notify-debouncer-mini = "0.4"
tracing-appender = "0.2"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["alloc"] }
hkdf = "0.12"
hmac = "0.12"
flate2 = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
